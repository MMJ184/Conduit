[package]
name = "conduit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "conduit"
path = "src/main.rs"

[dependencies]
conduit-core = { path = "../conduit-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dialoguer = "0.11"
colored = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
